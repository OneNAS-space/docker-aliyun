name: Docker Image Sync

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Batch Sync with Skopeo
        run: |
          if [ ! -f images.txt ]; then
            echo "Error: images.txt not found!"
            exit 1
          fi

          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue

            RAW_IMAGE=$(echo $line | xargs)

            if [[ $RAW_IMAGE != *"/"* ]] || [[ $RAW_IMAGE != *"."* ]]; then
              SRC_IMAGE="docker.io/library/$RAW_IMAGE"
            elif [[ $RAW_IMAGE != *"."* ]]; then
              SRC_IMAGE="docker.io/$RAW_IMAGE"
            else
              SRC_IMAGE="$RAW_IMAGE"
            fi

            IMAGE_TAG=$(echo $RAW_IMAGE | awk -F/ '{print $NF}')
            DEST_IMAGE="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${IMAGE_TAG}"

            echo "----------------------------------------"
            echo "Processing: $SRC_IMAGE"
            echo "Target:     $DEST_IMAGE"

            if skopeo copy --all --quiet docker://$SRC_IMAGE docker://$DEST_IMAGE; then
              echo "✅ Success: $IMAGE_TAG"
            else
              echo "❌ Failed: $IMAGE_TAG"
            fi

          done < images.txt
