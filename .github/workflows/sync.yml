name: Docker Smart Sync

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "images.txt"

permissions:
  contents: read

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Login to Aliyun
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Smart Sync Logic
        run: |
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            RAW_IMAGE=$(echo $line | xargs)

            # 补全源地址
            if [[ $RAW_IMAGE != *"/"* ]]; then
              SRC_IMAGE="docker://docker.io/library/$RAW_IMAGE"
            elif [[ $RAW_IMAGE != *"."* ]]; then
              SRC_IMAGE="docker://docker.io/$RAW_IMAGE"
            else
              SRC_IMAGE="docker://$RAW_IMAGE"
            fi

            # 提取 Tag 生成目标地址
            IMAGE_TAG=$(echo $RAW_IMAGE | awk -F/ '{print $NF}')
            DEST_IMAGE="docker://${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/$IMAGE_TAG"

            echo "----------------------------------------"
            echo "Checking: $RAW_IMAGE"

            # 获取源和目标的 Digest 指纹进行对比
            SRC_DIGEST=$(skopeo inspect --format '{{.Digest}}' $SRC_IMAGE || echo "error_src")
            DEST_DIGEST=$(skopeo inspect --format '{{.Digest}}' $DEST_IMAGE || echo "not_exists")

            if [ "$SRC_DIGEST" == "$DEST_DIGEST" ] && [ "$SRC_DIGEST" != "error_src" ]; then
              echo "✅ No change detected for $IMAGE_TAG. Skipping sync."
            else
              echo "🚀 Change detected or Image missing. Syncing $IMAGE_TAG..."
              skopeo copy --all --quiet $SRC_IMAGE $DEST_IMAGE
              echo "Successfully updated $IMAGE_TAG"
            fi

          done < images.txt
